name: Godot Android Final Candidate

on:
  workflow_dispatch:
  push:
    paths:
      - "godot/**"
      - ".github/workflows/godot-android-build.yml"

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export PATH="/usr/local/lib/android/sdk/cmdline-tools/latest/bin:/usr/local/lib/android/sdk/platform-tools:$PATH"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          command -v sdkmanager
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.7.2-stable_linux.x86_64

      - name: Download Android export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q Godot_v4.7.2-stable_export_templates.tpz -d godot-templates
          cp godot-templates/templates/android_debug.apk "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          cp godot-templates/templates/android_release.apk "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Configure Android paths
        run: |
          mkdir -p godot/build

      - name: Create export preset
        run: |
          cat > godot/export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/MedievalSandbox.apk"
          [preset.0.options]
          package/unique_name="com.mahdiata1390.medievalsandbox"
          package/name="Medieval Sandbox"
          package/version_code=2
          package/version_name="1.0.0-rc"
          package/launcher_icons/main_192x192=""
          package/launcher_icons/adaptive_foreground_432x432=""
          package/launcher_icons/adaptive_background_432x432=""
          package/launcher/strip_large_resources=true
          graphics/opengl/force_angle=false
          architecture/arm64-v8a=true
          architecture/armeabi-v7a=false
          EOF

      - name: Fetch production art packs
        run: |
          set -euo pipefail
          mkdir -p godot/assets/production/medieval_village godot/assets/production/nature godot/assets/production/characters
          curl -L --fail --retry 3 -o /tmp/medieval_village.zip https://opengameart.org/sites/default/files/medieval_village_megakitstandard.zip
          curl -L --fail --retry 3 -o /tmp/stylized_nature.zip https://opengameart.org/sites/default/files/stylized_nature_megakitstandard.zip
          curl -L --fail --retry 3 -o godot/assets/production/characters/character.glb https://raw.githubusercontent.com/programasweights/avatar/main/public/assets/character.glb
          unzip -q /tmp/medieval_village.zip -d /tmp/medieval_village
          unzip -q /tmp/stylized_nature.zip -d /tmp/stylized_nature
          cp -a /tmp/medieval_village/. godot/assets/production/medieval_village/
          cp -a /tmp/stylized_nature/. godot/assets/production/nature/
          find godot/assets/production -type f | sort | head -40

      - name: Validate project
        run: |
          ./godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --editor --quit

      - name: Runtime smoke test
        run: |
          timeout 12s ./godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --quit-after 5 || test $? -eq 124

      - name: Export APK
        run: |
          ./godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --export-debug "Android" build/MedievalSandbox.apk

      - name: Final candidate QA report
        run: |
          echo "=== MEDIEVAL SANDBOX FINAL CANDIDATE ==="
          echo "Godot: 4.7.2"
          echo "Android: arm64-v8a"
          echo "Branch: release-candidate"
          echo "Runtime smoke test: passed if previous step exited 0"
          echo "APK:"
          ls -lh godot/build/MedievalSandbox.apk

      - name: Verify APK
        run: |
          test -s godot/build/MedievalSandbox.apk
          ls -lh godot/build/MedievalSandbox.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MedievalSandbox-Android
          path: godot/build/MedievalSandbox.apk

# Build verification trigger: final gameplay integration.
# Final QA build trigger: Android release-candidate smoke test.
