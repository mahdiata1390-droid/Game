name: Godot Android Final Candidate

on:
  workflow_dispatch:
  push:
    paths:
      - "godot/**"
      - ".github/workflows/godot-android-build.yml"

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download Godot
        run: |
          set -euo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.7.2-stable_linux.x86_64

      - name: Download Android export templates
        run: |
          set -euo pipefail
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPLATE_DIR"
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q Godot_v4.7.2-stable_export_templates.tpz -d godot-templates
          cp godot-templates/templates/android_debug.apk "$TEMPLATE_DIR/"
          cp godot-templates/templates/android_release.apk "$TEMPLATE_DIR/"
          cp godot-templates/templates/version.txt "$TEMPLATE_DIR/" || true

      - name: Import project
        run: |
          set -euo pipefail
          ./godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --import

      # Godot's editor reports parse errors but still exits 0. A plain
      # "--editor --quit" therefore passes on a completely broken project, which
      # is how this repository previously shipped non-compiling scripts. These
      # gates exit non-zero for real failures.
      - name: Generate production asset manifest
        run: |
          set -euo pipefail
          ./godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://qa/generate_asset_manifest.gd

      - name: Validate every script compiles
        run: |
          set -euo pipefail
          ./godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://qa/validate_scripts.gd

      - name: Headless gameplay QA
        run: |
          set -euo pipefail
          ./godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://qa/headless_qa.gd

      - name: Runtime boot smoke test
        run: |
          set -euo pipefail
          ./godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --fixed-fps 60 --quit-after 3600 2>&1 | tee boot.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load" boot.log; then
            echo "Runtime produced script errors"
            exit 1
          fi

      - name: Export APK
        run: |
          set -euo pipefail
          mkdir -p godot/build
          ./godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --export-debug "Android" build/MedievalSandbox.apk

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="godot/build/MedievalSandbox.apk"
          test -s "$APK"
          ls -lh "$APK"
          unzip -tq "$APK"
          python3 - <<'PY'
          import zipfile, sys
          apk = "godot/build/MedievalSandbox.apk"
          with zipfile.ZipFile(apk) as z:
              names = z.namelist()
          required = ["AndroidManifest.xml", "classes.dex", "resources.arsc"]
          missing = [n for n in required if n not in names]
          if missing:
              sys.exit("APK missing: %s" % missing)
          if not any(n.startswith("assets/") for n in names):
              sys.exit("APK does not package the Godot game data")
          if not any(n.startswith("lib/") for n in names):
              sys.exit("APK does not package a native library")
          print("APK verified with %d entries" % len(names))
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MedievalSandbox-Android
          path: godot/build/MedievalSandbox.apk
