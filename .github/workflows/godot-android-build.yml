name: Godot Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - "godot/**"
      - ".github/workflows/godot-android-build.yml"

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk\}\}"
          export ANDROID_HOME="${ANDROID_SDK_ROOT\}"
          export PATH="${ANDROID_SDK_ROOT\}/cmdline-tools/latest/bin:${ANDROID_SDK_ROOT\}/cmdline-tools/bin:${ANDROID_SDK_ROOT\}/platform-tools:$PATH"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT\}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${ANDROID_HOME\}" >> "$GITHUB_ENV"
          echo "${ANDROID_SDK_ROOT\}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_SDK_ROOT\}/platform-tools" >> "$GITHUB_PATH"
          command -v sdkmanager
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.7.2-stable_linux.x86_64

      - name: Download Android export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q Godot_v4.7.2-stable_export_templates.tpz -d godot-templates
          cp godot-templates/templates/android_debug.apk "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          cp godot-templates/templates/android_release.apk "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Configure Android paths
        run: |
          mkdir -p godot/build
          cat > godot/android.env <<EOF
          ANDROID_HOME=$ANDROID_HOME
          EOF

      - name: Create export preset
        run: |
          cat > godot/export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          export_path="build/MedievalSandbox.apk"
          [preset.0.options]
          package/unique_name="com.mahdiata1390.medievalsandbox"
          package/name="Medieval Sandbox"
          package/version_code=1
          package/version_name="0.1.0"
          package/launcher_icons/main_192x192=""
          package/launcher_icons/adaptive_foreground_432x432=""
          package/launcher_icons/adaptive_background_432x432=""
          package/launcher/strip_large_resources=true
          graphics/opengl/force_angle=false
          architecture/arm64-v8a=true
          architecture/armeabi-v7a=false
          EOF

      - name: Validate project
        run: |
          ./godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --editor --quit

      - name: Export APK
        run: |
          ./godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --export-release "Android" build/MedievalSandbox.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MedievalSandbox-Android
          path: godot/build/MedievalSandbox.apk
